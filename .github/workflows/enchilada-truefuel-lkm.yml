name: Enchilada TrueFuel exact-kernel LKM

on:
  push:
    branches:
      - feature/enchilada-truefuel-lkm-4500
    paths:
      - 'tools/battery/truefuel/**'
      - 'drivers/power/supply/qcom/bq27541_fuelgauger.c'
      - 'arch/arm64/boot/dts/qcom/enchilada.dtsi'
      - '.github/workflows/enchilada-truefuel-lkm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enchilada-truefuel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install 4.19 ARM64 compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex build-essential \
            libssl-dev libelf-dev clang lld llvm ccache gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi device-tree-compiler cpio kmod
      - name: Prepare BakaSU and exact kernel config
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/setup-bakasu.sh
          MAKE_ARGS=(O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip LLVM=1)
          make "${MAKE_ARGS[@]}" vendor/sdm845-perf_defconfig
          sh scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/enchilada.config
          make "${MAKE_ARGS[@]}" olddefconfig
          grep -qx 'CONFIG_MODULES=y' out/.config
          grep -qx 'CONFIG_MODVERSIONS=y' out/.config
          grep -qx '# CONFIG_MODULE_SIG is not set' out/.config
          grep -qx '# CONFIG_KPROBES is not set' out/.config
      - name: Build kernel and Versioned LKM
        shell: bash
        run: |
          set -euo pipefail
          MAKE_ARGS=(O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip LLVM=1)
          python3 - <<'PY'
          from pathlib import Path
          text = Path('tools/battery/truefuel/op6_truefuel.c').read_text()
          assert 'POWER_SUPPLY_PROP_BQ_SOC' in text
          assert 'POWER_SUPPLY_PROP_REMAINING_CAPACITY' in text
          assert 'hardware_soc_path=' in text
          for bad in ('i2c_transfer', 'i2c_get_adapter', 'i2c_master_send',
                      'i2c_smbus_write', 'BQ27411_UNSEAL_KEY', 'module_param'):
              assert bad not in text, bad
          native = Path('drivers/power/supply/qcom/bq27541_fuelgauger.c').read_text()
          assert 'OP6_TRUEFUEL_NATIVE_READONLY' in native
          assert 'device_create_file(&client->dev, &dev_attr_op6_truefuel_hw)' in native
          assert 'device_remove_file(&client->dev, &dev_attr_op6_truefuel_hw)' in native
          PY
          make -j"$(nproc)" "${MAKE_ARGS[@]}" DTC_FLAGS=-@ dtbs
          make -j"$(nproc)" "${MAKE_ARGS[@]}" DTC_FLAGS=-@ Image.gz-dtb
          test -s out/Module.symvers
          make -j2 "${MAKE_ARGS[@]}" M="${GITHUB_WORKSPACE}/tools/battery/truefuel" modules
          KO=tools/battery/truefuel/op6_truefuel.ko
          test -s "$KO"
          file "$KO"
          readelf -h "$KO" | grep -E 'ELF64|AArch64'
          modinfo -F vermagic "$KO"
          modinfo -F depends "$KO"
          echo "Kernel release: $(cat out/include/config/kernel.release)"
          modinfo -F vermagic "$KO" | grep -F "$(cat out/include/config/kernel.release)"
          mkdir -p dist
          cp "$KO" dist/
          cp out/include/config/kernel.release dist/kernel.release
          cp out/.config dist/compiled-kernel.config
          sha256sum "$KO" > dist/SHA256SUMS
          printf 'Build only. NOT phone load tested. Does not change SOC or capacity.\n' > dist/SAFETY.txt
      - name: Upload read-only LKM for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: op6-truefuel-v02-bakasu-lkm-readonly-untested
          path: dist/
          if-no-files-found: error
          retention-days: 7
