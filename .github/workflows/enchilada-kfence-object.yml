name: OnePlus6 KFENCE idle targeted compile

on:
  push:
    branches:
      - feature/enchilada-kfence-idle
    paths:
      - 'mm/kfence/core.c'
      - '.github/workflows/enchilada-kfence-object.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-kfence:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler
      - name: Integrate pinned BakaSU
        run: sh scripts/setup-bakasu.sh
      - name: Prepare OnePlus 6 config and KFENCE
        shell: bash
        run: |
          set -euo pipefail
          MAKE_ARGS=(O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1)
          make "${MAKE_ARGS[@]}" vendor/sdm845-perf_defconfig
          sh scripts/kconfig/merge_config.sh -m -O out out/.config \
            arch/arm64/configs/vendor/enchilada.config \
            arch/arm64/configs/vendor/enchilada-perf-experimental.config
          make "${MAKE_ARGS[@]}" olddefconfig
          grep -qx 'CONFIG_KFENCE=y' out/.config
          grep -qx 'CONFIG_KFENCE_SAMPLE_INTERVAL=500' out/.config
          make "${MAKE_ARGS[@]}" prepare
          make -j2 "${MAKE_ARGS[@]}" mm/kfence/core.o
          test -s out/mm/kfence/core.o
