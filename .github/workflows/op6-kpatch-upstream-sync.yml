name: OP6 KernelPatch official upstream snapshot (review PR only)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare-upstream-pr:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enchilada-kpatch-native-upstream-0139
          persist-credentials: true
      - name: Fetch latest official KernelPatch source (GPL, hash verified)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync_op6_kernelpatch.py --update
      - name: Offline source manifest integrity
        run: python3 tools/check_op6_kernelpatch_snapshot.py
      - name: Open non-automatic review PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(op6-kpm): update KernelPatch official upstream snapshot for review'
          title: '[Upstream review] KernelPatch native snapshot refresh'
          body: 'Updates pinned official KPM/ARM64 hook sources. REVIEW manually for 4.19 compatibility and BakaSU conflicts. No automatic merge. This change alone does not enable executable KPM.'
          branch: sync/op6-kpatch-official
          base: feature/enchilada-kpatch-native-upstream-0139
          delete-branch: false
          add-paths: |
            third_party/kernelpatch/**
